[project]
name = "docmind-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1,<2", "boto3>=1.35,<2", "celery[redis]>=5.6.3,<6", "email-validator>=2.3.0,<3", "fastapi>=0.115,<1",
  "openai>=1.0,<3", "openpyxl>=3.1,<4", "pydantic-settings>=2.6,<3", "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "psycopg[binary]>=3.2,<4", "redis>=5,<7", "clamd>=1.0.2,<2", "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.32,<1", "pdf2image>=1.17,<2", "pytesseract>=0.3.13,<1", "pypdf>=6.21.2,<7",
  "jsonschema>=4.23,<5", "defusedxml>=0.7.1,<1", "httpx>=0.28.1,<1", "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
  "opentelemetry-instrumentation-celery>=0.49b0"
]
[project.optional-dependencies]
# Vector indexing (app.ingestion.vectorstore); the dev extra also installs it for the tests.
qdrant = ["qdrant-client>=1.12,<2"]
ner = ["spacy>=3.7,<4"]  # then: python -m spacy download <PII_SPACY_MODEL>
embeddings = ["fastembed>=0.4,<1"]  # local ONNX embeddings
dev = ["python-docx>=1.1,<2", "qdrant-client>=1.12,<2", "httpx>=0.28.1", "mypy>=1.13", "pytest>=8.3", "pytest-cov>=5", "ruff>=0.17.2", "types-openpyxl", "types-jsonschema", "pip-audit>=2.7", "bandit>=1.8"]
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["app", "app.evaluation", "app.ingestion", "app.integrations"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["B008", "BLE001"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["docx.*", "defusedxml.*", "fastembed.*", "spacy.*", "qdrant_client.*", "boto3.*", "botocore.*", "pytesseract.*", "pdf2image.*", "celery.*", "clamd.*", "pwdlib.*", "opentelemetry.*", "prometheus_client.*"]
ignore_missing_imports = true
