name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - name: Static security analysis (bandit)
        run: bandit -r app -ll -q
      - name: Dependency vulnerabilities (pip-audit)
        id: pip_audit
        run: |
          set +e
          pip-audit --skip-editable > /tmp/pip-audit.txt 2>&1
          code=$?
          cat /tmp/pip-audit.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      # TODO(temporary): the agent sandbox that normally drives this PR has no
      # network access to fetch Actions log output, so this posts the raw
      # finding to the PR instead. Remove once the underlying advisory is
      # resolved and this step is reliably green.
      - name: Report pip-audit findings on the PR
        if: steps.pip_audit.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### pip-audit findings (backend, commit ${{ github.sha }})"
            echo '```'
            cat /tmp/pip-audit.txt
            echo '```'
          } > /tmp/pip-audit-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/pip-audit-comment.md
      - name: Fail job if pip-audit found issues
        if: steps.pip_audit.outputs.exit_code != '0'
        run: exit 1

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency vulnerabilities
        id: npm_audit
        run: |
          set +e
          npm audit --audit-level=high --omit=dev > /tmp/npm-audit.txt 2>&1
          code=$?
          cat /tmp/npm-audit.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      # TODO(temporary): see the matching step in the backend job above.
      - name: Report npm audit findings on the PR
        if: steps.npm_audit.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### npm audit findings (frontend, commit ${{ github.sha }})"
            echo '```'
            cat /tmp/npm-audit.txt
            echo '```'
          } > /tmp/npm-audit-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/npm-audit-comment.md
      - name: Fail job if npm audit found issues
        if: steps.npm_audit.outputs.exit_code != '0'
        run: exit 1

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose config -q
          REDIS_PASSWORD=ci docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Build images
        id: docker_build
        run: |
          set +e
          docker compose build > /tmp/docker-build.txt 2>&1
          code=$?
          cat /tmp/docker-build.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      # TODO(temporary): see the matching step in the backend job above --
      # this job never used to run at all (backend/frontend always failed
      # first), so this is the first real result for it and the driving
      # sandbox has no way to read Actions logs directly.
      - name: Report docker build failure on the PR
        if: steps.docker_build.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### docker compose build failure (commit ${{ github.sha }})"
            echo '```'
            tail -c 60000 /tmp/docker-build.txt
            echo '```'
          } > /tmp/docker-build-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/docker-build-comment.md
      - name: Fail job if the build failed
        if: steps.docker_build.outputs.exit_code != '0'
        run: exit 1

  e2e:
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the stack
        run: |
          cp .env.example .env
          # The suite registers many accounts from one address within a minute.
          echo 'RATE_LIMIT_REGISTER=1000' >> .env
          echo 'RATE_LIMIT_LOGIN=1000' >> .env
          echo 'RATE_LIMIT_UPLOAD=1000' >> .env
          docker compose up --build -d --wait
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run e2e tests
        id: e2e_tests
        working-directory: frontend
        run: |
          set +e
          npm run test:e2e > /tmp/e2e-output.txt 2>&1
          code=$?
          cat /tmp/e2e-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Dump stack logs on failure
        if: steps.e2e_tests.outputs.exit_code != '0'
        run: |
          docker compose logs --no-color --tail=200 > /tmp/e2e-stack-logs.txt
          # The failing test's own org gets lost in the tail once later tests
          # add their own noise. It creates its project with name=E2E
          # (unique in the suite), so grab the api service's requests around
          # that specific call instead of guessing from the general tail.
          docker compose logs --no-color api > /tmp/e2e-api-logs-full.txt
          grep -n -B5 -A20 'name=E2E' /tmp/e2e-api-logs-full.txt > /tmp/e2e-api-logs-e2e-org.txt || true
      - name: Dump accessibility snapshot of the failed page
        if: steps.e2e_tests.outputs.exit_code != '0'
        working-directory: frontend
        run: |
          : > /tmp/e2e-error-context.txt
          find test-results -name error-context.md -print0 2>/dev/null | while IFS= read -r -d '' f; do
            { echo "--- $f ---"; cat "$f"; echo; } >> /tmp/e2e-error-context.txt
          done
          true
      - name: Encode the failure screenshot inline (the sandbox can't fetch artifacts)
        if: steps.e2e_tests.outputs.exit_code != '0'
        working-directory: frontend
        run: |
          : > /tmp/e2e-screenshot-b64.txt
          : > /tmp/e2e-screenshot-debug.txt
          {
            echo "pwd: $(pwd)"
            echo "test-results exists: $([ -d test-results ] && echo yes || echo no)"
            echo "full tree:"
            find test-results -type f 2>&1
          } > /tmp/e2e-screenshot-debug.txt
          shot=$(find test-results -iname "*.png" | head -n1 || true)
          echo "chosen png: [$shot]" >> /tmp/e2e-screenshot-debug.txt
          if [ -n "$shot" ]; then
            size=$(stat -c%s "$shot" 2>/dev/null || echo "?")
            echo "png size: $size bytes" >> /tmp/e2e-screenshot-debug.txt
            small="/tmp/e2e-shot-small.png"
            # ubuntu-latest doesn't ship imagemagick; the raw screenshot's base64
            # (~210KB for a 158KB PNG) blows past the report step's 50KB cutoff
            # and was silently dropped. Install it so the image actually shrinks.
            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update -qq >/dev/null 2>&1
              sudo apt-get install -y -qq imagemagick >/dev/null 2>&1
              echo "installed imagemagick: $(command -v convert || echo failed)" >> /tmp/e2e-screenshot-debug.txt
            fi
            if command -v convert >/dev/null 2>&1; then
              echo "using convert" >> /tmp/e2e-screenshot-debug.txt
              # 600x/q40 still produced ~70KB of base64, over the report step's
              # cutoff -- this is a plain full-page screenshot (mostly white
              # background), so a much smaller/blurrier copy is still legible.
              if convert "$shot" -resize 350x -quality 30 "$small" 2>>/tmp/e2e-screenshot-debug.txt; then
                base64 -w0 "$small" > /tmp/e2e-screenshot-b64.txt
              else
                echo "convert failed, falling back to raw" >> /tmp/e2e-screenshot-debug.txt
                base64 -w0 "$shot" > /tmp/e2e-screenshot-b64.txt
              fi
            else
              echo "no convert, using raw base64" >> /tmp/e2e-screenshot-debug.txt
              base64 -w0 "$shot" > /tmp/e2e-screenshot-b64.txt
            fi
          fi
          echo "b64 length: $(wc -c < /tmp/e2e-screenshot-b64.txt)" >> /tmp/e2e-screenshot-debug.txt
          true
      - name: Extract the verbose action log for the failing test
        if: steps.e2e_tests.outputs.exit_code != '0'
        run: |
          # pw:api logs every actionability retry interleaved with the other
          # tests' output; slice out just the lines generated while the
          # failing test was running (between the previous test's checkmark
          # and this one's), so the retry detail isn't lost to a tail cutoff.
          sed -n '/tests\/e2e\/auth\.spec\.ts.*dashboard/,/tests\/e2e\/document-processing\.spec\.ts.*processing pipeline/p' \
            /tmp/e2e-output.txt > /tmp/e2e-action-log.txt || true
          true
      # this job never ran before this PR either (it needs docker, which
      # always failed first), and the driving sandbox can't read Actions
      # logs directly.
      - name: Report e2e failure on the PR
        if: steps.e2e_tests.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### e2e test failure (commit ${{ github.sha }})"
            echo '#### test:e2e output'
            echo '```'
            tail -c 50000 /tmp/e2e-output.txt
            echo '```'
            echo '#### verbose action log for the failing test (pw:api)'
            echo '```'
            tail -c 60000 /tmp/e2e-action-log.txt
            echo '```'
            echo '#### accessibility snapshot at time of failure'
            echo '```'
            tail -c 20000 /tmp/e2e-error-context.txt
            echo '```'
            echo '#### docker compose logs (tail)'
            echo '```'
            tail -c 10000 /tmp/e2e-stack-logs.txt
            echo '```'
            echo '#### api requests around the failing test'\''s project (name=E2E)'
            echo '```'
            tail -c 20000 /tmp/e2e-api-logs-e2e-org.txt
            echo '```'
            echo '#### screenshot extraction debug'
            echo '```'
            cat /tmp/e2e-screenshot-debug.txt
            echo '```'
            b64=$(cat /tmp/e2e-screenshot-b64.txt)
            if [ -n "$b64" ] && [ "${#b64}" -lt 50000 ]; then
              echo '#### failure screenshot'
              echo "<img src=\"data:image/png;base64,${b64}\" />"
            fi
          } > /tmp/e2e-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/e2e-comment.md
      - name: Fail job if e2e tests failed
        if: steps.e2e_tests.outputs.exit_code != '0'
        run: exit 1
