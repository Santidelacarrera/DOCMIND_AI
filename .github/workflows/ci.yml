name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - name: Static security analysis (bandit)
        run: bandit -r app -ll -q
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high --omit=dev

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Build images
        run: docker compose build

  e2e:
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the stack
        run: |
          cp .env.example .env
          # The suite registers many accounts from one address within a minute.
          echo 'RATE_LIMIT_REGISTER=1000' >> .env
          echo 'RATE_LIMIT_LOGIN=1000' >> .env
          echo 'RATE_LIMIT_UPLOAD=1000' >> .env
          docker compose up --build -d --wait
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
