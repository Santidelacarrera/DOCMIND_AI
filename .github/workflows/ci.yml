name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: OCR and queue test dependencies
        # Tesseract/Poppler: scanned documents in the evaluation corpus. redis-server: the
        # real-broker job-queue tests (tests/test_celery_redis.py skip without it).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils redis-server
          sudo systemctl stop redis-server || true
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - name: Extraction quality gate (reference corpus, offline baseline)
        run: python -m app.evaluation --min-f1 0.89 --output-dir eval_reports
      - name: RAG quality gate (retrieval, citations, abstention, tenant leaks)
        run: >-
          python -m app.evaluation.rag --output-dir eval_reports
          --min-recall-at-5 0.95 --min-citation-accuracy 0.85 --min-abstention-accuracy 1.0
      - name: RAG quality gate, extended corpus (identifiers, tables, contradictions, injection; ADR-005)
        run: >-
          python -m app.evaluation.rag --corpus extended --retrieval hybrid --output-dir eval_reports/extended
          --min-recall-at-5 1.0 --min-citation-accuracy 0.85 --min-abstention-accuracy 1.0
      - name: RAG quality gate, verified generation with the offline generator
        run: >-
          python -m app.evaluation.rag --corpus extended --retrieval hybrid --answer-mode generative
          --output-dir eval_reports/generative --min-citation-accuracy 1.0 --min-abstention-accuracy 1.0
      - name: Keep the evaluation report
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: backend/eval_reports/
      - name: Static security analysis (bandit)
        run: bandit -r app -ll -q
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable

  backend-postgres:
    # Same suite on PostgreSQL: real row locks and constraint behaviour that SQLite cannot show.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: docmind, POSTGRES_PASSWORD: docmind, POSTGRES_DB: docmind }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://docmind:docmind@localhost:5432/docmind
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: OCR and queue test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils redis-server
          sudo systemctl stop redis-server || true
      - run: pip install '.[dev]'
      - run: pytest -q --ignore=tests/test_docker_integration.py

  backend-postgres-rls:
    # RLS phase 3 as production runs it: the application connects as docmind_app (not the table
    # owner, no SUPERUSER, no BYPASSRLS), so every policy applies to every query of the suite;
    # maintenance tasks run as docmind_system (tests/conftest.py, TEST_RLS_ENFORCED).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: docmind, POSTGRES_PASSWORD: docmind, POSTGRES_DB: docmind }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://docmind:docmind@localhost:5432/docmind
      TEST_RLS_ENFORCED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: OCR and queue test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils redis-server
          sudo systemctl stop redis-server || true
      - run: pip install '.[dev]'
      - run: pytest -q --ignore=tests/test_docker_integration.py

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high --omit=dev

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose config -q
          REDIS_PASSWORD=ci docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          REDIS_PASSWORD=ci docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup config -q
      - name: Alert rules (promtool check and unit tests)
        working-directory: deploy/prometheus
        run: |
          docker run --rm -v "$PWD:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm -v "$PWD:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml
      - name: Backup script syntax
        run: sh -n deploy/backup/pg_backup.sh
      - name: Build images
        run: docker compose build

  e2e:
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the stack
        run: |
          cp .env.example .env
          # The suite registers many accounts from one address within a minute.
          echo 'RATE_LIMIT_REGISTER=1000' >> .env
          echo 'RATE_LIMIT_LOGIN=1000' >> .env
          echo 'RATE_LIMIT_UPLOAD=1000' >> .env
          docker compose up --build -d --wait
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run e2e tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Collect stack logs
        if: failure()
        run: docker compose logs --no-color --tail=500 > e2e-stack-logs.txt
      - name: Keep the Playwright report, traces and stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
            e2e-stack-logs.txt
