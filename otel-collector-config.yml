receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: basic
  # Point this at your real backend (Tempo, Jaeger, a vendor OTLP endpoint...)
  # and reference it in the traces pipeline below.

processors:
  batch: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
