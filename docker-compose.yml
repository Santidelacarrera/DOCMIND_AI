services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docmind}
      POSTGRES_USER: ${POSTGRES_USER:-docmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  storage-init:
    image: alpine:3.21
    command: ["sh", "-c", "mkdir -p /data/documents && chown -R 1000:1000 /data/documents"]
    volumes: [documents:/data/documents]
  api:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    # Development convenience: apply migrations before serving. Production runs them as a separate release step.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    volumes: [./backend:/app, documents:/data/documents]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  worker:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    volumes: [./backend:/app, documents:/data/documents]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  scheduler:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    # Runs periodic maintenance (stuck-job recovery). Exactly one instance must run.
    # Needs the documents volume too: importing app.worker (for the celery app)
    # transitively imports app.storage, which eagerly creates its storage root
    # at import time, and without this mount that's an unwritable path inside
    # the container rather than the shared, pre-chowned volume.
    command: celery -A app.worker.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    volumes: [./backend:/app, documents:/data/documents]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  web:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* values are inlined into the browser bundle at build time.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]

  # ---- Observability stack (opt-in) ------------------------------------------
  # `docker compose --profile observability up` to also bring these up.
  # Prometheus scrapes GET /metrics on the api service (see prometheus.yml);
  # the collector receives OTLP/HTTP traces from the api/worker when
  # OTEL_EXPORTER_OTLP_ENDPOINT points at it (http://otel-collector:4318).
  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [observability]
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["3001:3000"]
    volumes: [grafana_data:/var/lib/grafana]
    depends_on: [prometheus]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    profiles: [observability]
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes: [./otel-collector-config.yml:/etc/otel-collector-config.yml:ro]
    ports: ["4318:4318"]
volumes:
  postgres_data:
  documents:
  grafana_data:
